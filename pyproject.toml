[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echonav"
version = "1.0.0"
description = "EchoNav Gen.1: RGB-to-BEV inference with interchangeable planar planners"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-FAIR-Noncommercial-Research AND LicenseRef-DINOv3"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["numpy>=1.24,<3", "Pillow>=10", "torch>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
echonav = "echonav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
